name: Python tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [SuperNav_v1, SuperNav_v1_5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
        working-directory: ${{ matrix.project }}
      - run: python -m pytest -q
        working-directory: ${{ matrix.project }}

  installed-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [SuperNav_v1, SuperNav_v1_5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        working-directory: ${{ matrix.project }}
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/supernav-wheel" .
      - name: Install wheel with base dependencies in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/supernav-installed"
          "$RUNNER_TEMP/supernav-installed/bin/python" -m pip install "$RUNNER_TEMP"/supernav-wheel/supernav-*.whl
      - name: Verify installed operation without simulator SDKs
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/supernav-installed/bin/python" "$GITHUB_WORKSPACE/${{ matrix.project }}/scripts/check_installed_package.py"'
