"share/supernav/configs/benchmarks/multi_global_task/prompts" = ["configs/benchmarks/multi_global_task/prompts/common_localnav.md", "configs/benchmarks/multi_global_task/prompts/end.md", "configs/benchmarks/multi_global_task/prompts/movement_localnav.md"]
