[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supernav"
version = "0.1.0"
description = "An Agentic Navigation System for Any Task in Any Scene"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-PRL-1.0 AND MIT AND OFL-1.1"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/supernav/web/static/fonts/SpaceGrotesk-OFL.txt",
    "src/supernav/web/static/fonts/IBMPlexMono-OFL.txt",
    "docs/release/assets/SpaceGrotesk-OFL.txt",
]
dependencies = ["PyYAML>=6", "Pillow>=10"]

[project.optional-dependencies]
agents = ["mcp>=1.27,<2", "openai>=1", "python-dotenv>=1", "numpy>=1.24"]
evaluation = ["numpy>=1.24", "matplotlib>=3.7", "httpx>=0.27"]
ai2thor = ["ai2thor==5.0.0", "numpy>=1.24,<2", "mcp>=1.27,<2"]
viewer = ["rerun-sdk", "numpy>=1.24"]
test = ["pytest>=8", "numpy>=1.24", "mcp>=1.27,<2", "openai>=1", "python-dotenv>=1", "setuptools>=77", "wheel"]

[project.scripts]
supernav = "supernav.cli:main"

[project.urls]
Repository = "https://github.com/zju3dv/SuperNav"
Homepage = "https://zju3dv.github.io/SuperNav/"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".cache/pytest"

[tool.setuptools]
include-package-data = false

[tool.setuptools.cmdclass]
egg_info = "scripts.release_build.SafeEggInfo"
build_py = "scripts.release_build.SafeBuildPy"

[tool.setuptools.package-dir]
"" = "src"
scripts = "scripts"

[tool.setuptools.packages.find]
where = ["src"]
include = ["supernav*", "habitat_contract*"]
namespaces = false

[tool.setuptools.package-data]
"supernav.methods.demand_driven" = ["*.md"]
"supernav.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/fonts/*.ttf", "static/fonts/*.txt"]

[tool.setuptools.data-files]
"share/supernav/configs/agents" = ["configs/agents/codex-benchmark.json", "configs/agents/codex-user.json"]
"share/supernav/configs/backends" = ["configs/backends/ai2thor.json", "configs/backends/habitat.json"]
"share/supernav/configs/experiments" = ["configs/experiments/habitat-geo-based-executor.json", "configs/experiments/habitat-learned-executor.json", "configs/experiments/ai2thor-primitive.json"]
"share/supernav/." = ["LICENSE", "THIRD_PARTY_NOTICES.md", "README.md", "README.zh-CN.md"]
"share/supernav/configs/benchmarks/global_task" = ["configs/benchmarks/global_task/README.md", "configs/benchmarks/global_task/README.zh-CN.md"]
"share/supernav/configs/benchmarks/global_task/prompts" = ["configs/benchmarks/global_task/prompts/common.md", "configs/benchmarks/global_task/prompts/common_localnav.md", "configs/benchmarks/global_task/prompts/end.md", "configs/benchmarks/global_task/prompts/movement_localnav.md"]
"share/supernav/configs/benchmarks/main/prompts" = ["configs/benchmarks/main/prompts/common.md", "configs/benchmarks/main/prompts/default_context.md", "configs/benchmarks/main/prompts/depth_tools.md", "configs/benchmarks/main/prompts/end.md", "configs/benchmarks/main/prompts/movement_oracle.md", "configs/benchmarks/main/prompts/movement_primitive.md", "configs/benchmarks/main/prompts/movement_visual_combined.md", "configs/benchmarks/main/prompts/movement_visual_ground_preview.md", "configs/benchmarks/main/prompts/movement_visual_ground_preview_locate.md", "configs/benchmarks/main/prompts/movement_visual_overlay.md", "configs/benchmarks/main/prompts/movement_visual_point.md", "configs/benchmarks/main/prompts/safety_tools.md", "configs/benchmarks/main/prompts/visual_nav_context.md"]
